<svg width="1500" height="400" viewBox="0 0 1500 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5fe8d0" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#7c5cff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="laptopEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5fe8d0"/>
      <stop offset="100%" stop-color="#8a5cff"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="400" fill="url(#bg2)"/>

  <!-- hexagon pattern, static -->
  <g opacity="0.08" stroke="#5fe8d0" stroke-width="1.5" fill="none">
    <polygon points="90,60 130,80 130,120 90,140 50,120 50,80"/>
    <polygon points="160,140 200,160 200,200 160,220 120,200 120,160"/>
    <polygon points="1400,60 1440,80 1440,120 1400,140 1360,120 1360,80"/>
    <polygon points="1330,160 1370,180 1370,220 1330,240 1290,220 1290,180"/>
    <polygon points="750,20 790,40 790,80 750,100 710,80 710,40"/>
  </g>

  <!-- circuit lines left -->
  <g opacity="0.3" stroke="#5fe8d0" stroke-width="1.2" fill="none">
    <path d="M0,50 H120 L150,80 V150 M0,120 H70 M0,200 H100 L130,230 M0,260 H60"/>
  </g>
  <circle cx="150" cy="80" r="3" fill="#5fe8d0"/>
  <circle cx="130" cy="230" r="3" fill="#8a5cff"/>

  <!-- circuit lines right -->
  <g opacity="0.3" stroke="#8a5cff" stroke-width="1.2" fill="none">
    <path d="M1500,50 H1380 L1350,80 V150 M1500,120 H1430 M1500,200 H1400 L1370,230 M1500,260 H1440"/>
  </g>
  <circle cx="1350" cy="80" r="3" fill="#8a5cff"/>
  <circle cx="1370" cy="230" r="3" fill="#5fe8d0"/>

  <!-- center glow, pulsing -->
  <ellipse cx="750" cy="200" rx="320" ry="170" fill="url(#centerGlow)">
    <animate attributeName="rx" values="300;340;300" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- decorative hexagons behind laptop, subtle pulse -->
  <g opacity="0.5">
    <polygon points="640,90 690,115 690,165 640,190 590,165 590,115" fill="none" stroke="#5fe8d0" stroke-width="2">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="880,80 930,105 930,155 880,180 830,155 830,105" fill="none" stroke="#8a5cff" stroke-width="2">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- connector nodes with lines radiating from laptop -->
  <g stroke="#5fe8d0" stroke-width="1.3" opacity="0.6" fill="none">
    <path d="M610,150 L560,190 L560,230"/>
    <path d="M600,120 L510,70"/>
  </g>
  <g stroke="#8a5cff" stroke-width="1.3" opacity="0.6" fill="none">
    <path d="M900,150 L960,110 L1010,110"/>
    <path d="M890,120 L1000,150 L1050,150"/>
    <path d="M900,190 L980,240"/>
  </g>

  <circle cx="560" cy="230" r="5" fill="#5fe8d0">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="510" cy="70" r="5" fill="#5fe8d0">
    <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="110" r="6" fill="#8a5cff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="150" r="6" fill="#8a5cff">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="240" r="6" fill="#8a5cff">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Laptop, centered -->
  <g transform="translate(600,90)">
    <!-- outer glow ring around screen -->
    <rect x="-6" y="-6" width="312" height="197" rx="14" fill="none" stroke="url(#laptopEdge)" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- screen -->
    <rect x="0" y="0" width="300" height="185" rx="10" fill="url(#screenGrad2)" stroke="url(#laptopEdge)" stroke-width="2"/>
    <rect x="10" y="10" width="280" height="18" rx="3" fill="#16202f"/>
    <circle cx="20" cy="19" r="3" fill="#ff5f56"/>
    <circle cx="32" cy="19" r="3" fill="#ffbd2e"/>
    <circle cx="44" cy="19" r="3" fill="#27c93f"/>

    <!-- sidebar -->
    <rect x="10" y="34" width="55" height="141" fill="#0e1522"/>
    <rect x="18" y="44" width="35" height="4" fill="#5fe8d0" opacity="0.7"/>
    <rect x="18" y="56" width="30" height="4" fill="#8a5cff" opacity="0.6"/>
    <rect x="18" y="68" width="25" height="4" fill="#5fe8d0" opacity="0.5"/>
    <rect x="18" y="80" width="32" height="4" fill="#8a5cff" opacity="0.5"/>

    <!-- code lines, gentle width pulse -->
    <g stroke-linecap="round">
      <rect x="72" y="44" width="70" height="4" rx="2" fill="#5fe8d0">
        <animate attributeName="width" values="70;90;70" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="72" y="56" width="100" height="4" rx="2" fill="#8a5cff"/>
      <rect x="86" y="68" width="80" height="4" rx="2" fill="#5fe8d0" opacity="0.7"/>
      <rect x="86" y="80" width="60" height="4" rx="2" fill="#a06cff"/>
      <rect x="72" y="92" width="90" height="4" rx="2" fill="#5fe8d0">
        <animate attributeName="width" values="90;65;90" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="86" y="104" width="70" height="4" rx="2" fill="#8a5cff" opacity="0.7"/>
      <rect x="72" y="116" width="55" height="4" rx="2" fill="#5fe8d0" opacity="0.6"/>
    </g>

    <!-- mini chart -->
    <polyline points="200,140 215,120 230,130 245,105 260,115 275,90" fill="none" stroke="#5fe8d0" stroke-width="2.5"/>
    <circle cx="275" cy="90" r="3" fill="#a06cff"/>

    <!-- base -->
    <path d="M-25,185 L325,185 L305,207 L-5,207 Z" fill="#16202f" stroke="url(#laptopEdge)" stroke-width="1.5"/>
  </g>
</svg>
