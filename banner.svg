<svg width="1500" height="400" viewBox="0 0 1500 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="55%" stop-color="#10182b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a06cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4dd0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4dd0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a5cff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8a5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1500" height="400" fill="url(#bg)"/>

  <!-- hexagon pattern (subtle, static) -->
  <g opacity="0.10" stroke="#4dd0ff" stroke-width="1.5" fill="none">
    <polygon points="60,40 100,60 100,100 60,120 20,100 20,60"/>
    <polygon points="140,20 180,40 180,80 140,100 100,80 100,40"/>
    <polygon points="40,180 80,200 80,240 40,260 0,240 0,200"/>
    <polygon points="1360,20 1400,40 1400,80 1360,100 1320,80 1320,40"/>
    <polygon points="1440,120 1480,140 1480,180 1440,200 1400,180 1400,140"/>
    <polygon points="1300,220 1340,240 1340,280 1300,300 1260,280 1260,240"/>
    <polygon points="120,300 160,320 160,360 120,380 80,360 80,320"/>
  </g>

  <!-- circuit lines left -->
  <g opacity="0.35" stroke="#3fb6e0" stroke-width="1.2" fill="none">
    <path d="M0,60 H70 M0,150 H50 L80,180 M0,320 H90 L120,350"/>
  </g>
  <circle cx="70" cy="60" r="3" fill="#4dd0ff"/>
  <circle cx="120" cy="350" r="3" fill="#8a5cff"/>

  <!-- twinkling dots -->
  <circle cx="640" cy="120" r="4" fill="#4dd0ff">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1450" cy="200" r="3.5" fill="#8a5cff">
    <animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="240" r="3" fill="#4dd0ff">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- code snippet top-left -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#5fd0e8" opacity="0.85">
    <text x="30" y="35">const evli = "dev";</text>
    <text x="30" y="55">function explore()... {</text>
    <text x="42" y="75">...</text>
    <text x="30" y="95">}<tspan opacity="1">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </tspan></text>
  </g>

  <!-- script tag top-right -->
  <text x="1470" y="30" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#9fb0c8" opacity="0.8">&lt;script&gt;console.log()&lt;/script&gt;</text>

  <!-- script tag + code bottom-right -->
  <text x="1005" y="215" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#9fb0c8" opacity="0.75">&lt;script&gt;console.log()&lt;/script&gt;</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#5fd0e8" opacity="0.8">
    <text x="1240" y="235">const evli = "dev";</text>
    <text x="1240" y="253">function explore() ...{</text>
  </g>

  <!-- glow behind name -->
  <ellipse cx="330" cy="185" rx="260" ry="90" fill="url(#glow)">
    <animate attributeName="rx" values="250;270;250" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Name -->
  <text x="120" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="78" font-weight="700" fill="url(#nameGrad)">
    Cemal Evli
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3.5s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="185" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#e6ecf5">
    Full Stack Developer
  </text>

  <!-- Laptop glow -->
  <ellipse cx="1050" cy="190" rx="220" ry="150" fill="url(#glowPurple)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Laptop -->
  <g transform="translate(900,90)">
    <!-- screen -->
    <rect x="0" y="0" width="300" height="185" rx="10" fill="url(#screenGrad)" stroke="#4dd0ff" stroke-width="2"/>
    <rect x="10" y="10" width="280" height="18" rx="3" fill="#16202f"/>
    <circle cx="20" cy="19" r="3" fill="#ff5f56"/>
    <circle cx="32" cy="19" r="3" fill="#ffbd2e"/>
    <circle cx="44" cy="19" r="3" fill="#27c93f"/>

    <!-- sidebar -->
    <rect x="10" y="34" width="55" height="141" fill="#0e1522"/>
    <rect x="18" y="44" width="35" height="4" fill="#4dd0ff" opacity="0.7"/>
    <rect x="18" y="56" width="30" height="4" fill="#8a5cff" opacity="0.6"/>
    <rect x="18" y="68" width="25" height="4" fill="#4dd0ff" opacity="0.5"/>

    <!-- code lines -->
    <g stroke-linecap="round">
      <rect x="72" y="44" width="70" height="4" rx="2" fill="#4dd0ff">
        <animate attributeName="width" values="70;90;70" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="72" y="56" width="100" height="4" rx="2" fill="#8a5cff"/>
      <rect x="86" y="68" width="80" height="4" rx="2" fill="#4dd0ff" opacity="0.7"/>
      <rect x="86" y="80" width="60" height="4" rx="2" fill="#a06cff"/>
      <rect x="72" y="92" width="90" height="4" rx="2" fill="#4dd0ff">
        <animate attributeName="width" values="90;65;90" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="86" y="104" width="70" height="4" rx="2" fill="#8a5cff" opacity="0.7"/>
    </g>

    <!-- mini chart -->
    <polyline points="200,140 215,120 230,130 245,105 260,115 275,90" fill="none" stroke="#4dd0ff" stroke-width="2.5"/>
    <circle cx="275" cy="90" r="3" fill="#a06cff"/>

    <!-- base -->
    <path d="M-25,185 L325,185 L305,205 L-5,205 Z" fill="#16202f" stroke="#4dd0ff" stroke-width="1.5"/>
  </g>

  <!-- connector dots around laptop -->
  <g fill="#4dd0ff">
    <circle cx="850" cy="140" r="4"/>
    <circle cx="1260" cy="110" r="4" fill="#8a5cff"/>
    <circle cx="1280" cy="230" r="4"/>
    <circle cx="880" cy="260" r="3.5" fill="#8a5cff"/>
  </g>
  <g stroke="#4dd0ff" stroke-width="1.2" opacity="0.5">
    <path d="M850,140 L900,150" fill="none"/>
    <path d="M1260,110 L1200,120" fill="none"/>
    <path d="M1280,230 L1210,215" fill="none"/>
    <path d="M880,260 L920,240" fill="none"/>
  </g>
</svg>
